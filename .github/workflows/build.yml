name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/v*/v*.*
      - alpha/v*/v*.*
      - release/v*/v*.*
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

jobs:
  kfd:
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v3-alpha
    secrets: inherit
    with:
      buildchain-alpha-contract-lock-path: buildchain.alpha-contract-lock.json
      buildchain-stable-contract-lock-path: buildchain.contract-lock.json
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","runner":"[\"ubuntu-24.04\"]"}]
      setup-node: true
      node-version: "24"
      require-install: true
      require-build: false
      require-verify: true
      artifact-name: kfd
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: |
        README.md
        TRADEMARKS.md
        kfd.release.json
        cases
        decisions
        drafts
        docs
        evidence
        registry.json
        standards.json
        schemas
        site
        scripts
        bin
        verifier/Cargo.toml
        verifier/Cargo.lock
        verifier/crates
        verifier/dist
        verifier/extraction-manifest.json
        verifier/fixtures
        verifier/specs
        docs/load-bearing-dogfood.md
        buildchain.alpha-contract-lock.json
        buildchain.contract-lock.json
        buildchain.release-propagation.json
        .buildchain/kfd-1/contract-world.witness.json
        .buildchain/kfd-2
        .buildchain/kfd-3
        package.json
        release-impact.json
      release-candidate: true
      publish-channel: ${{ startsWith(github.base_ref, 'release/') && 'release' || (startsWith(github.base_ref, 'alpha/') && 'alpha' || 'none') }}
      expected-artifacts-json: >-
        {"minFiles":62,"requiredPaths":["README.md","TRADEMARKS.md","kfd.release.json","registry.json","standards.json","drafts/README.md","drafts/registry.json","drafts/action-state-separation.md","docs/formal-model.md","docs/KFD-1-formal.md","docs/KFD-2-formal.md","docs/KFD-3-formal.md","docs/KFD-4-formal.md","docs/KFD-5-formal.md","docs/KFD-6-formal.md","docs/KFD-7-activation.md","docs/verifier.md","evidence/kfd-7/activation-record.json","cases/registry.json","cases/live/proof-carrying-work-object/README.md","cases/live/proof-carrying-work-object/genesis.md","cases/live/proof-carrying-work-object/ontology-split.md","cases/live/proof-carrying-work-object/distinguishability.md","cases/live/proof-carrying-work-object/kfd-method-trace.md","cases/live/proof-carrying-work-object/propagation-hypothesis.md","cases/live/proof-carrying-work-object/cuts/0001-genesis.json","cases/live/proof-carrying-work-object/cuts/0002-pursuit.json","cases/live/proof-carrying-work-object/cuts/0002-warrant.json","cases/live/proof-carrying-work-object/reviews/README.md","schemas/kfd-candidate-registry.schema.json","schemas/kfd-live-case-registry.schema.json","schemas/kfd-standards.schema.json","schemas/kfd-verification-bundle.schema.json","schemas/kfd-verification-report.schema.json","schemas/kfd-1/contract-world.schema.json","schemas/kfd-1/witness.schema.json","schemas/kfd-2/release-claims.schema.json","schemas/kfd-2/release-trust-passport.schema.json","schemas/kfd-3/collaboration-interface.schema.json","schemas/kfd-3/witness.schema.json","schemas/kfd-4/observer-perspective.schema.json","schemas/kfd-4/perspective-replay.schema.json","schemas/kfd-5/primitive-discovery.schema.json","schemas/kfd-6/autonomous-discovery-loop.schema.json","site/kfd-site.json","scripts/check.mjs","scripts/check-verifier.mjs","scripts/check-verifier-artifact.mjs","scripts/update-site-bundle.mjs","scripts/update-kfd-1-witness.mjs","scripts/update-kfd-2-claim.mjs","scripts/update-kfd-3-witness.mjs","scripts/npm-publish-transaction.mjs","bin/kfd.mjs","verifier/Cargo.toml","verifier/dist/kfd_verifier.wasm","buildchain.alpha-contract-lock.json","buildchain.contract-lock.json","buildchain.release-propagation.json",".buildchain/kfd-1/contract-world.witness.json",".buildchain/kfd-2/public-release-trust.claim.json",".buildchain/kfd-3/collaboration-interface.json",".buildchain/kfd-3/collaboration-interface.prebuild.json",".buildchain/kfd-3/collaboration-interface.artifact.json","package.json","release-impact.json"]}
