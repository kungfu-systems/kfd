name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/v*/v*.*
      - alpha/v*/v*.*
      - release/v*/v*.*
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  kfd:
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v2
    secrets: inherit
    with:
      buildchain-alpha-contract-lock-path: buildchain.alpha-contract-lock.json
      buildchain-stable-contract-lock-path: buildchain.contract-lock.json
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","runner":"[\"ubuntu-24.04\"]"}]
      setup-node: true
      node-version: "24"
      require-install: true
      require-build: false
      require-verify: true
      artifact-name: kfd
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: |
        README.md
        TRADEMARKS.md
        kfd.release.json
        decisions
        docs
        registry.json
        standards.json
        schemas
        site
        scripts
        buildchain.alpha-contract-lock.json
        buildchain.contract-lock.json
        buildchain.release-propagation.json
        .buildchain/kfd-1/contract-world.witness.json
        .buildchain/kfd-2
        .buildchain/kfd-3
        package.json
        release-impact.json
      release-candidate: true
      publish-channel: ${{ startsWith(github.base_ref, 'release/') && 'release' || (startsWith(github.base_ref, 'alpha/') && 'alpha' || 'none') }}
      expected-artifacts-json: >-
        {"minFiles":30,"requiredPaths":["README.md","TRADEMARKS.md","kfd.release.json","registry.json","standards.json","schemas/kfd-standards.schema.json","schemas/kfd-1/contract-world.schema.json","schemas/kfd-1/witness.schema.json","schemas/kfd-2/release-claims.schema.json","schemas/kfd-2/release-trust-passport.schema.json","schemas/kfd-3/collaboration-interface.schema.json","schemas/kfd-3/witness.schema.json","site/kfd-site.json","scripts/check.mjs","scripts/update-site-bundle.mjs","scripts/update-kfd-1-witness.mjs","scripts/update-kfd-2-claim.mjs","scripts/update-kfd-3-witness.mjs","scripts/npm-publish-transaction.mjs","buildchain.alpha-contract-lock.json","buildchain.contract-lock.json","buildchain.release-propagation.json",".buildchain/kfd-1/contract-world.witness.json",".buildchain/kfd-2/public-release-trust.claim.json",".buildchain/kfd-3/collaboration-interface.json",".buildchain/kfd-3/collaboration-interface.prebuild.json",".buildchain/kfd-3/collaboration-interface.artifact.json","package.json","release-impact.json"]}
