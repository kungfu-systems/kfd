name: Buildchain Ref Promotion

on:
  workflow_run:
    workflows: ["Verify"]
    branches:
      - "alpha/v*/v*"
      - "release/v*/v*"
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Verified alpha/release commit to promote. Defaults to the current workflow ref SHA.
        required: false
        default: ""
      target-ref:
        description: Buildchain channel branch to promote
        required: true
        default: alpha/v1/v1.0
      dry-run:
        description: Only print planned tag updates
        required: true
        default: "true"

permissions:
  # Buildchain v3 validates the reusable graph against the caller envelope
  # before any job starts, so these capabilities must remain explicit here.
  artifact-metadata: write
  attestations: write
  contents: write
  actions: read
  checks: write
  issues: write
  id-token: write
  pull-requests: write

jobs:
  reject-manual-apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject manual apply
        run: |
          echo "::error::Manual Buildchain ref promotion is limited to dry-run."
          echo "::error::Merge through alpha/release and let a successful Verify workflow_run promote refs."
          exit 1

  promote:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs['dry-run'] == 'true') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@v3-alpha
    secrets:
      BUILDCHAIN_PROMOTION_TOKEN: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
      KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY: ${{ secrets.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
      buildchain-issue-app-id: ${{ secrets.BUILDCHAIN_ISSUE_APP_ID }}
      buildchain-issue-app-private-key: ${{ secrets.BUILDCHAIN_ISSUE_APP_PRIVATE_KEY }}
    with:
      buildchain-ref: ${{ startsWith(github.event.workflow_run.head_branch || inputs['target-ref'], 'alpha/') && 'v3-alpha' || 'v3' }}
      target-ref: ${{ github.event.workflow_run.head_branch || inputs['target-ref'] }}
      target-sha: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      buildchain-contract-lock-path: ${{ startsWith(github.event.workflow_run.head_branch || inputs['target-ref'], 'alpha/') && 'buildchain.alpha-contract-lock.json' || 'buildchain.contract-lock.json' }}
      package-manager: custom
      artifact-name: kfd
      artifact-patterns: |
        kfd-x86_64-unknown-linux-gnu-*
        kfd-aarch64-unknown-linux-gnu-*
        kfd-x86_64-apple-darwin-*
        kfd-aarch64-apple-darwin-*
        kfd-x86_64-pc-windows-msvc-*
      release-candidate-workflow-file: build.yml
      release-candidate-workflow-name: Build
      required-status-check: "check / check"
      required-artifact-count: 0
      publish-required-artifacts-json: "[]"
      publish-mode: publish-final-version
      publish-dist-tag: ${{ startsWith(github.event.workflow_run.head_branch || inputs['target-ref'], 'alpha/') && 'alpha' || 'latest' }}
      publish-package-set-order: as-provided
      publish-package-main: "@kungfu-tech/kfd"
      release-passport: true
      release-passport-product-name: KFD
      release-passport-impact-json: release-impact.json
      release-passport-kfd-1-witness-jsons: .buildchain/kfd-1/contract-world.witness.json
      release-passport-kfd-2-claim-jsons: .buildchain/kfd-2/public-release-trust.claim.json
      release-passport-kfd-3-prebuild-witness-jsons: .buildchain/kfd-3/collaboration-interface.prebuild.json
      release-passport-kfd-3-artifact-witness-jsons: .buildchain/kfd-3/collaboration-interface.artifact.json
      publication-auto-admission: ${{ github.event_name == 'workflow_run' }}
      publication-auto-no-gate: ${{ github.event_name == 'workflow_run' }}
      publication-publisher-workflow-path: .github/workflows/buildchain-ref-promotion.yml
      publication-product: KFD
      publication-target: npm:@kungfu-tech/kfd
      publication-package-name: "@kungfu-tech/kfd"
      release-propagation-config-path: buildchain.release-propagation.json
      github-release: true
      github-release-payload-patterns: |
        kfd-*.tar.gz
        kfd-*.zip
        kfd-*.sha256
        kfd-*.provenance.json
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] == 'true' }}
