name: Release Propagation Work Recovery

on:
  workflow_dispatch:
    inputs:
      promotion-run-id:
        description: "Buildchain Ref Promotion run containing the captured Work artifact"
        required: true
        type: string
      artifact-name:
        description: "Exact package-propagation-work artifact name reported by promotion"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  recover:
    name: Recover and verify paused Work
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact promotion artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RUN_ID: ${{ inputs.promotion-run-id }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          mkdir -p .buildchain/release-propagation-recovery
          gh run download "${PROMOTION_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir .buildchain/release-propagation-recovery

      - name: Verify capture-only recovery boundary
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = ".buildchain/release-propagation-recovery";
          const readJson = (name) => JSON.parse(fs.readFileSync(path.join(root, name), "utf8"));
          const capture = readJson("capture-result.json");
          const upstream = readJson("upstream-release.json");
          const plan = readJson("plan.json");

          if (capture.contract !== "kungfu-buildchain-package-release-propagation-capture-result" ||
              capture.schemaVersion !== 1 || capture.workCount !== 1 || capture.works?.length !== 1) {
            throw new Error("recovery artifact must contain exactly one package propagation Work");
          }
          if (capture.release?.sourceSha !== upstream.sourceSha ||
              capture.release?.tagTargetSha !== upstream.tagTargetSha ||
              plan.upstreamRelease?.sourceSha !== upstream.sourceSha) {
            throw new Error("capture, upstream release, and plan source roots disagree");
          }

          const workFiles = fs.readdirSync(root, { recursive: true })
            .filter((name) => /(^|\/)work\.json$/.test(name));
          const statusFiles = fs.readdirSync(root, { recursive: true })
            .filter((name) => /(^|\/)status\.json$/.test(name));
          if (workFiles.length !== 1 || statusFiles.length !== 1) {
            throw new Error("recovery artifact must contain exactly one work.json and status.json");
          }
          const work = readJson(workFiles[0]);
          const status = readJson(statusFiles[0]);
          if (work.contentRoot !== capture.works[0].workRoot ||
              work.upstream?.release?.sourceSha !== upstream.sourceSha) {
            throw new Error("captured Work root or release binding disagrees");
          }
          if (work.authority?.mode !== "capture-only" || work.intent?.publishToProduction !== false ||
              status.lifecycle !== "paused" || status.nextAction?.action !== "claim") {
            throw new Error("recovered Work must remain capture-only, paused, and claim-only");
          }
          console.log(JSON.stringify({
            workRoot: work.contentRoot,
            lifecycle: status.lifecycle,
            nextAction: status.nextAction,
          }, null, 2));
          NODE

      - name: Preserve verified recovery artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: recovered-${{ inputs.artifact-name }}
          path: .buildchain/release-propagation-recovery
          if-no-files-found: error
          retention-days: 14
