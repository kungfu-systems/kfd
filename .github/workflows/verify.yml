name: Protected Dev Delivery Bootstrap
run-name: "KFD PR #${{ inputs.expected-pr-number }} · two-phase Delivery Warrant"

on:
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: "Trusted Buildchain v4 runtime selector"
        required: false
        default: "v4-alpha"
      target-branch:
        description: "Exact protected development branch"
        required: true
      expected-pr-number:
        description: "Exact ready and approved PR number"
        required: true
        type: number
      expected-head-sha:
        description: "Exact immutable PR head"
        required: true
      source-workflow-run-id:
        description: "Exact successful source workflow run"
        required: true
        type: number
      assignment-root:
        description: "Exact native Assignment root"
        required: true
      initiative-root:
        description: "Exact parent Initiative root"
        required: true
      source-identity-root:
        description: "Semantic source identity root"
        required: true
      source-patch-root:
        description: "Semantic patch root"
        required: true
      plan-root:
        description: "Native qualification plan root"
        required: true
      closure-root:
        description: "Affected closure root"
        required: true
      dependency-root:
        description: "Dependency graph root"
        required: true
      toolchain-root:
        description: "Exact native toolchain root"
        required: true
      environment-root:
        description: "Exact native execution environment contract root"
        required: true
      affected-paths-json:
        description: "JSON array representing the affected closure"
        required: true
      shard-evidence-roots-json:
        description: "Additional exact native shard evidence roots"
        required: false
        default: "[]"
      native-command:
        description: "Slow native qualification command"
        required: true
      native-command-root:
        description: "Exact native command contract root"
        required: true
      native-heartbeat-seconds:
        description: "Heartbeat cadence while native qualification runs"
        required: false
        type: number
        default: 30
      delivery-class:
        description: "Bounded delivery class"
        required: false
        default: "native-proof-required"
      delivery-priority:
        description: "Reviewed delivery priority"
        required: false
        default: "ordinary"

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read
  statuses: write

jobs:
  deliver:
    uses: kungfu-systems/buildchain/.github/workflows/dev-pr-auto-merge.yml@v4-alpha
    with:
      buildchain-ref: ${{ inputs.buildchain-ref }}
      target-branch: ${{ inputs.target-branch }}
      expected-pr-number: ${{ inputs.expected-pr-number }}
      expected-head-sha: ${{ inputs.expected-head-sha }}
      source-workflow-run-id: ${{ inputs.source-workflow-run-id }}
      delivery-warrant-mode: required
      handoff-workflow-id: verify.yml
      assignment-root: ${{ inputs.assignment-root }}
      initiative-root: ${{ inputs.initiative-root }}
      source-identity-root: ${{ inputs.source-identity-root }}
      source-patch-root: ${{ inputs.source-patch-root }}
      plan-root: ${{ inputs.plan-root }}
      closure-root: ${{ inputs.closure-root }}
      dependency-root: ${{ inputs.dependency-root }}
      toolchain-root: ${{ inputs.toolchain-root }}
      environment-root: ${{ inputs.environment-root }}
      affected-paths-json: ${{ inputs.affected-paths-json }}
      shard-evidence-roots-json: ${{ inputs.shard-evidence-roots-json }}
      native-command: ${{ inputs.native-command }}
      native-command-root: ${{ inputs.native-command-root }}
      native-heartbeat-seconds: ${{ inputs.native-heartbeat-seconds }}
      delivery-class: ${{ inputs.delivery-class }}
      delivery-priority: ${{ inputs.delivery-priority }}
      required-status-checks: check / check
      queue-admission-context: Queue admission lease
      active-lease-context: Queue family lease/exact
      ready-label: state/ready
      block-labels: blocked,do-not-merge,work-in-progress
      allowed-head-prefixes: feature/,fix/,chore/,docs/,ci/,refactor/,automation/,review/
      landing-mode: direct
      dry-run: false
    secrets:
      github-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
