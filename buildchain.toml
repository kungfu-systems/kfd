schema = 1

[project]
type = "package"
name = "@kungfu-tech/kfd"

[version]
required = true
strategy = "semver"
next = "auto"

[[version.files]]
type = "json"
path = "package.json"
key = "version"

[publish]
mode = "publish-final-version"
auth = "trusted-publishing"
package_set_order = "as-provided"
main_package = "@kungfu-tech/kfd"

[lifecycle.install]
command = "node -e \"console.log('kfd install: no dependencies')\""

[lifecycle.verify]
command = "node scripts/check.mjs"

[lifecycle.publish]
command = "node scripts/npm-publish-transaction.mjs"
