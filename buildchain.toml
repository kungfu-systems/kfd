schema = 1

[project]
type = "package"
name = "@kungfu-tech/kfd"

[version]
required = true
strategy = "anchored"
next = "manual"
manifest = "kfd.release.json"

[[version.files]]
type = "json"
path = "package.json"
key = "version"

[publish]
mode = "publish-final-version"
auth = "trusted-publishing"
package_set_order = "platforms-first-main-last"
main_package = "@kungfu-tech/kfd"

[lifecycle.install]
command = "node -e \"console.log('kfd install: no dependencies')\""

[lifecycle.build]
command = "node -e \"console.log('kfd build: source package')\""

[lifecycle.verify]
command = "npm run check"

[lifecycle.publish]
command = "node scripts/npm-publish-transaction.mjs"
