[workspace]
members = [
  "crates/core",
  "crates/cli",
  "crates/wasm",
]
resolver = "2"

[workspace.package]
version = "1.0.0-alpha.64"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kungfu-systems/kfd"

[workspace.dependencies]
regex = "1.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
